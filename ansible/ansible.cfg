[defaults]
inventory = ./inventory/hosts.ini
roles_path = ./roles
retry_files_enabled = False
interpreter_python = auto_silent
result_format = yaml
bin_ansible_callbacks = True

[privilege_escalation]
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Every rebuild gets a new host key. accept-new trusts a host seen for the first time,
# but still refuses a *changed* key for a known host (`make up` removes the stale key first).
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new
pipelining = True
