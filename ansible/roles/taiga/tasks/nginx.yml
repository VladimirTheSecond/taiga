---
# Configure Nginx as reverse proxy for Taiga, TLS via Let's Encrypt
#
# Certbot runs in `certonly --webroot` mode instead of `--nginx`: with --nginx, certbot edits
# the site config, and the next Ansible run overwrites those edits and breaks HTTPS.
# With webroot, Ansible owns the whole Nginx config and certbot only fetches the certificate.

- name: Install Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Install Certbot (if SSL enabled)
  ansible.builtin.apt:
    name: certbot
    state: present
  when: enable_ssl

- name: Create ACME challenge webroot
  ansible.builtin.file:
    path: "{{ letsencrypt_webroot }}"
    state: directory
    mode: "0755"
  when: enable_ssl

- name: Remove default Nginx site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Ensure Nginx is running
  ansible.builtin.systemd:
    name: nginx
    state: started
    enabled: true

# First pass: HTTP only (on a fresh server there is no certificate yet)
- name: Render HTTP site
  ansible.builtin.include_tasks: nginx_site.yml

# The deploy hook reloads Nginx after automatic renewals by the certbot systemd timer.
- name: Obtain Let's Encrypt certificate
  ansible.builtin.command: >-
    certbot certonly --webroot -w {{ letsencrypt_webroot }}
    -d {{ taiga_domain }}
    --non-interactive --agree-tos
    --email {{ letsencrypt_email }}
    --deploy-hook "systemctl reload nginx"
    {{ '--staging' if letsencrypt_staging | bool else '' }}
  args:
    creates: /etc/letsencrypt/live/{{ taiga_domain }}/fullchain.pem
  when: enable_ssl

# Second pass: now with the HTTPS server block and the HTTP -> HTTPS redirect
- name: Render HTTPS site
  ansible.builtin.include_tasks: nginx_site.yml
  when: enable_ssl
